name: Comparator audit

# Runs the official leanprover/comparator on every SuperdiffusionAudit/<X> pair: for each
# pair it checks that Solution proves a statement whose full dependency
# closure matches Challenge's, uses only the permitted axioms, and is
# accepted by BOTH the Lean kernel (replay) and the independent nanoda
# kernel (enable_nanoda flipped on for the CI run only).
#
# GitHub-hosted runners (`ubuntu-latest`: 4 vCPU, 16 GB RAM, 6 h per job).
# Mathlib olean artifacts come from `lake exe cache get`; CoarseGraining and
# MarkovProcess are compiled by the `deps` job and cached; the four verification
# tools are cached under their pinned revisions.  The project's own `.lake/build`
# is restored when the CI workflow has already banked it for this or an earlier
# commit, and rebuilt from source otherwise.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: comparator-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPARATOR_REV: "5756749"      # leanprover/comparator commit
  LEAN4EXPORT_REV: "v4.26.0"     # MUST match ./lean-toolchain
  NANODA_REV: "6ae1f0c"          # ammkrn/nanoda_lib commit
  LANDRUN_REV: "811cfff"         # Zouuup/landrun commit (v0.1.18)

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — the two source dependencies, byte-for-byte the `deps` job of
  # `build.yml` and sharing its cache key, so whichever workflow runs first
  # pays for them and the other one restores.
  # ---------------------------------------------------------------------------
  deps:
    name: Dependency oleans
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reclaim runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Enlarge swap
        shell: bash
        run: |
          sudo swapoff -a || true
          swapdir=/mnt
          [ -d "$swapdir" ] || swapdir="${RUNNER_TEMP:-/tmp}"
          sudo rm -f "$swapdir/lean-swapfile"
          sudo fallocate -l 16G "$swapdir/lean-swapfile"
          sudo chmod 600 "$swapdir/lean-swapfile"
          sudo mkswap "$swapdir/lean-swapfile"
          sudo swapon "$swapdir/lean-swapfile"
          free -h

      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true

      - name: Restore the dependency build cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/packages/CoarseGraining/.lake/build
            .lake/packages/MarkovProcess/.lake/build
          key: lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Build the dependency packages
        run: lake build @CoarseGraining @MarkovProcess

      - name: Save the dependency build cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/packages/CoarseGraining/.lake/build
            .lake/packages/MarkovProcess/.lake/build
          key: lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

  # ---------------------------------------------------------------------------
  # Job 2 — the audit surfaces, the four tools, and the three comparator runs.
  # ---------------------------------------------------------------------------
  comparator:
    name: Comparator over the three pairs
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reclaim runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Enlarge swap
        shell: bash
        run: |
          sudo swapoff -a || true
          swapdir=/mnt
          [ -d "$swapdir" ] || swapdir="${RUNNER_TEMP:-/tmp}"
          sudo rm -f "$swapdir/lean-swapfile"
          sudo fallocate -l 16G "$swapdir/lean-swapfile"
          sudo chmod 600 "$swapdir/lean-swapfile"
          sudo mkswap "$swapdir/lean-swapfile"
          sudo swapon "$swapdir/lean-swapfile"
          free -h

      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true

      - name: Restore the dependency build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/packages/CoarseGraining/.lake/build
            .lake/packages/MarkovProcess/.lake/build
          key: lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # Restore only, never save: the CI workflow owns this key, and one copy of
      # `.lake/build` in the repository's 10 GB cache quota is enough.  A miss
      # here just means this job compiles the library itself.
      - name: Restore project build artifacts
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-proj-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-proj-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Build the library and the audit surfaces
        run: lake build SuperdiffusionAudit

      - name: Restore verification tools
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/tools
          key: cmp-tools-${{ env.COMPARATOR_REV }}-${{ env.LEAN4EXPORT_REV }}-${{ env.NANODA_REV }}-${{ env.LANDRUN_REV }}

      # The comparator pins its own `lean-toolchain`, which is *not* this
      # project's; elan installs that second toolchain on demand here.
      - name: Build comparator
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/leanprover/comparator ~/tools/comparator
          git -C ~/tools/comparator checkout "$COMPARATOR_REV"
          cd ~/tools/comparator && lake build

      - name: Build lean4export (toolchain-matched)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/leanprover/lean4export ~/tools/lean4export
          git -C ~/tools/lean4export checkout "$LEAN4EXPORT_REV"
          test "$(cat ~/tools/lean4export/lean-toolchain)" = "$(cat lean-toolchain)" \
            || { echo "lean4export toolchain does not match project toolchain"; exit 1; }
          cd ~/tools/lean4export && lake build

      - name: Set up Go (for landrun)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build landrun (static)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/Zouuup/landrun ~/tools/landrun-src
          git -C ~/tools/landrun-src checkout "$LANDRUN_REV"
          mkdir -p ~/tools/bin
          cd ~/tools/landrun-src && CGO_ENABLED=0 go build -o ~/tools/bin/landrun ./cmd/landrun

      - name: Build nanoda
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          command -v rustup >/dev/null || {
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            . "$HOME/.cargo/env"
          }
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal
          git clone https://github.com/ammkrn/nanoda_lib ~/tools/nanoda_lib
          git -C ~/tools/nanoda_lib checkout "$NANODA_REV"
          cd ~/tools/nanoda_lib && PATH="$HOME/.cargo/bin:$PATH" cargo +stable build --release

      # Saved only on success, so a half-built tool tree can never be banked
      # under the pinned key and skipped by the next run.
      - name: Save verification tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/tools
          key: cmp-tools-${{ env.COMPARATOR_REV }}-${{ env.LEAN4EXPORT_REV }}-${{ env.NANODA_REV }}-${{ env.LANDRUN_REV }}

      # The comparator invokes landrun with `--best-effort`, which on a kernel
      # without Landlock runs the solution build UNSANDBOXED and still exits 0.
      # That would silently void the audit's isolation property, so the sandbox
      # is proved to be enforcing here instead: landrun is given exactly the
      # comparator's flags and asked to write outside the permitted set.  The
      # write must be refused.  (`--best-effort` is required, not optional:
      # landrun 0.1.18 demands Landlock ABI v5 without it, and the runner image
      # can be older than that while still enforcing at ABI v4.)
      - name: Prove the landrun sandbox is enforcing
        shell: bash
        run: |
          set -euo pipefail
          uname -r
          sudo cat /sys/kernel/security/lsm 2>/dev/null || echo "(securityfs unreadable)"
          probe="${RUNNER_TEMP:-/tmp}/landrun-escape-probe"
          rm -f "$probe"
          "$HOME/tools/bin/landrun" --best-effort --ro / --rw /dev -ldd -add-exec \
            -- /bin/sh -c "echo escaped > '$probe'" || true
          if [ -e "$probe" ]; then
            echo "landrun did NOT enforce: a write outside the sandbox succeeded."
            exit 1
          fi
          echo "landrun is enforcing: the out-of-sandbox write was refused."

      - name: Enable the nanoda kernel check (CI-only, on the workspace copy)
        run: |
          sed -i 's/"enable_nanoda": false/"enable_nanoda": true/' SuperdiffusionAudit/*/comparator.json

      - name: Run the comparator on every pair
        run: |
          set -euo pipefail
          # Resolve the tool paths from the runner's real home, never a
          # hard-coded hosted-runner location.
          export COMPARATOR_LANDRUN="$HOME/tools/bin/landrun"
          export COMPARATOR_LEAN4EXPORT="$HOME/tools/lean4export/.lake/build/bin/lean4export"
          export COMPARATOR_NANODA="$HOME/tools/nanoda_lib/target/release/nanoda_bin"
          for tool in "$COMPARATOR_LANDRUN" "$COMPARATOR_LEAN4EXPORT" "$COMPARATOR_NANODA" \
                      "$HOME/tools/comparator/.lake/build/bin/comparator"; do
            test -x "$tool" || { echo "missing tool: $tool"; exit 1; }
          done
          fail=0
          for X in GeneratorRenormalization AnomalousRegularity Superdiffusivity; do
            if [ ! -f "SuperdiffusionAudit/$X/Solution.lean" ]; then
              echo "$X: no Solution.lean, skipped"
              continue
            fi
            echo "::group::$X"
            if lake env ~/tools/comparator/.lake/build/bin/comparator "SuperdiffusionAudit/$X/comparator.json" \
                 | tee "/tmp/comparator-$X.log" \
               && grep -q "Your solution is okay!" "/tmp/comparator-$X.log"; then
              echo "$X: OK"
            else
              echo "$X: FAILED"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"

      - name: Upload comparator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparator-logs
          path: /tmp/comparator-*.log
