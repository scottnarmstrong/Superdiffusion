version: "v0.3"

project:
  name: "Superdiffusion"
  authors:
    - "Scott Armstrong"
    - "Tuomo Kuusi"
  license: "Apache-2.0"

sources:
  - title: "Superdiffusion and anomalous regularization in self-similar random incompressible flows"
    authors:
      - "Scott Armstrong"
      - "Ahmed Bou-Rabee"
      - "Tuomo Kuusi"
    id: "arXiv:2601.22142"
    url: "https://arxiv.org/abs/2601.22142"
    type: "manuscript"
    license: "all rights reserved"
    author_contacted: "n/a"     # the formalizers are among the authors of the source
    prior_work: ""

status:
  scope: >-
    A Lean 4 / Mathlib formalization of the quantitative theory of
    advection-diffusion in self-similar random incompressible flows: the
    renormalization of the effective diffusivity across scales (the
    superdiffusive asymptotics), the renormalization of the generator
    (quantitative homogenization of the Dirichlet problem at every scale,
    Theorem B), and the anomalous large-scale regularity theory (Theorem C),
    together with the sensitivity and coarse-matrix-derivative theory of
    Section 2.4 and the full Section 3 diffusivity recursion.  The
    formalization consumes the public CoarseGraining homogenization library
    (a 600k+-line development by the same authors) as its analytic base.
    SCOPE BOUNDARY: this repository gives complete formalizations of the
    paper's PDE statements -- Sections 1-4 of the paper; Section 5 is not yet
    formalized, and of the introduction's main results Theorems B and C are
    proved while Theorem A (a statement about the diffusion process itself)
    is not yet formalized, solely because the theory of diffusion processes
    is not yet developed in Mathlib.  The headline theorems are exposed
    publicly in Algsuperdiff/MainTheorems.lean; Theorems B and C are
    additionally checked by the Lean comparator (Audit/).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Algsuperdiff.diffusivity_asymptotics"
      file: "Algsuperdiff/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: ""
      literature_dependencies: []
    - declaration: "Algsuperdiff.generator_renormalization"
      file: "Algsuperdiff/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/GeneratorRenormalization/comparator.json"
      literature_dependencies: []
    - declaration: "Algsuperdiff.anomalous_regularity"
      file: "Algsuperdiff/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/AnomalousRegularity/comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models:
        - "claude-fable-5"
        - "claude-opus-5"
        - "gpt-5.6-sol"
        - "gpt-5.6-terra"
      framework: "Claude Code (Anthropic) and Codex (OpenAI) agentic coding harnesses; most code by the Claude models"
      tool_setup: >-
        Lake builds under leanprover/lean4:v4.26.0 with Mathlib v4.26.0 and the
        public CoarseGraining library at a pinned revision.  A frozen-statement
        manifest with content hashes bound the certified statement surface
        during development; every sealed theorem was certified by a two-key
        process (a prover chain plus an independent adversarial audit by a
        fresh model instance).  Multiple read-only subagents were used for
        hostile statement audits, dependency-order verification, and dead-code
        analysis.  The Lean comparator was run locally (leanprover/comparator
        commit 5756749, lean4export commit
        3e1cdfe206ec3f54bae4a548d814ce9b2c1bb43d at the v4.26.0 tag, landrun
        811cfff); both Audit pairs are accepted ("Your solution is okay!").
      cost:
        wall_time: "approximately two weeks of agentic work"
        accounts: "roughly three Claude Pro and three ChatGPT Pro accounts were used in parallel"
        spend_usd: "not separately tracked (subscription accounts)"
        hardware: "a 16-CPU / 124 GB RAM Ubuntu machine"
      prompting_notes: >-
        Human-directed agent work, closely supervised by the authors, with
        author rulings recorded verbatim for every statement-level decision.
  spend_usd: "not separately tracked (Claude subscription)"
  notes: >-
    All Lean code in this repository was written by the listed models under
    the close supervision of the authors.  Every proof is checked by the Lean
    kernel and Mathlib; the verified library contains no sorry and no custom
    axiom.  The Mathlib-only comparator challenge files
    (Audit/*/Challenge.lean) each contain exactly one intentional
    statement-level sorry (the theorem body), which is filled by the
    corresponding Audit/*/Solution.lean and checked by leanprover/comparator.

fidelity:
  divergences: >-
    The formalized statements match the paper as published: every
    statement-level correction found during the formalization was
    incorporated into the paper before release.  Rendering conventions (not
    divergences): the paper's "random variable" phrasing is rendered as
    explicit measurability hypotheses, and function-class memberships are
    rendered as their defining bounds.  The Theorem C comparator challenge
    presents the renormalized diffusivity existentially, carrying the profile
    band that Theorem B certifies, rather than naming the library's canonical
    construction; the library proves the canonical instance.

review:
  status: "author-verified"
  reviewers:
    - "Scott Armstrong"
    - "Tuomo Kuusi"
  notes: >-
    Correctness of every proof is guaranteed by the Lean kernel and Mathlib
    (no sorry, no custom axiom).  The authors reviewed the public statements
    and ruled on every statement-level decision during development; each of
    the two root theorems was additionally certified by an independent
    adversarial audit of the sealed statement and its proof cone.  This is
    not external peer review.

alignment:
  namespace: "Algsuperdiff"
  statements:
    - source: "The effective-diffusivity asymptotics (Section 3)"
      lean: "Algsuperdiff.diffusivity_asymptotics"
      module: "Algsuperdiff.MainTheorems"
      status: "proved"
      note: "Stated in full; with Theorem B, a PDE input to Theorem A."
    - source: "Theorem A (superdiffusivity of the diffusion process)"
      lean: ""
      module: ""
      status: "not-formalized"
      note: "Its PDE inputs (Theorem B and the diffusivity asymptotics) are proved; the probabilistic statement awaits diffusion-process theory in Mathlib; no other obstruction."
    - source: "Theorem B (renormalization of the generator)"
      lean: "Algsuperdiff.generator_renormalization"
      module: "Algsuperdiff.MainTheorems"
      status: "proved"
      note: "Comparator-audited via Audit/GeneratorRenormalization/."
    - source: "Theorem C (anomalous regularity)"
      lean: "Algsuperdiff.anomalous_regularity"
      module: "Algsuperdiff.MainTheorems"
      status: "proved"
      note: "Comparator-audited via Audit/AnomalousRegularity/."

acknowledgements: >-
  Built on Lean 4, Mathlib, Lake, the CoarseGraining library, and
  leanprover/comparator.  # TODO(author): funding acknowledgements.
